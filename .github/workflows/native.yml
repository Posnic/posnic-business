name: Native build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "app.json"
      - "package*.json"
      - ".github/workflows/native.yml"
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx expo prebuild --no-install --platform android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: posnic-business-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --no-install --platform ios
      - run: pod install
        working-directory: ios
      - run: xcodebuild -workspace PosnicBusiness.xcworkspace -scheme PosnicBusiness -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: posnic-business-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/PosnicBusiness.app
          if-no-files-found: error
